<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B15" />
      <stop offset="100%" stop-color="#140F0C" />
    </linearGradient>

    <!-- Atelier Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D79E" />
      <stop offset="45%" stop-color="#C9A96E" />
      <stop offset="100%" stop-color="#9A7B44" />
    </linearGradient>

    <!-- Warm Gold Ambient Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Luxury Canvas Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#C9A96E" stroke-width="1.2" stroke-opacity="0.4" />
  <circle cx="32" cy="32" r="26" fill="url(#goldGlow)" />

  <!-- The LamSparks Serif "L" -->
  <g filter="url(#goldShadow)">
    <path
      d="M 20 16 
         C 20 16, 26 16, 28 16 
         C 26.5 17.5, 26.5 19.5, 26.5 22 
         L 26.5 44 
         L 39 44 
         C 42.5 44, 45 43, 46.5 40 
         L 48 40.5 
         L 46 47 
         L 18 47 
         L 18 45.5 
         C 21.5 45.2, 22.5 44, 22.5 40 
         L 22.5 22 
         C 22.5 18, 21.5 16.8, 18 16.5 
         Z"
      fill="url(#goldGrad)"
    />
  </g>

  <!-- Signature LamSparks Starlight / Lens Spark -->
  <path
    d="M 46 16 
       Q 46 20 50 20 
       Q 46 20 46 24 
       Q 46 20 42 20 
       Q 46 20 46 16 Z"
    fill="url(#goldGrad)"
  />
</svg>
